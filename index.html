<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Créé par Iban -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Senpai Stream">
  <title>Senpai Stream</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f3;
      --fg: #1a1a1a;
      --muted: #9a9a8e;
      --border: #e0dfd9;
      --accent: #1a1a1a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    #install {
      display: none;
      min-height: 100dvh;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 36px;
      gap: 0;
      animation: fadein 0.6s ease both;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h2 {
      font-size: clamp(28px, 7vw, 42px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--fg);
      margin-bottom: 32px;
    }

    h2 span { color: var(--muted); }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 48px;
    }

    .step { display: flex; align-items: flex-start; gap: 14px; }

    .step-num {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      padding-top: 2px;
      min-width: 18px;
    }

    .step-text { font-size: 15px; line-height: 1.5; color: var(--fg); }
    .step-text strong { font-weight: 500; }

    .divider {
      width: 32px;
      height: 1px;
      background: var(--border);
      margin-bottom: 48px;
    }

    #go {
      appearance: none;
      background: none;
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 13px 28px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: var(--fg);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.01em;
    }

    #go:hover:not(:disabled) {
      background: var(--fg);
      border-color: var(--fg);
      color: var(--bg);
    }

    #go:disabled { opacity: 0.4; cursor: not-allowed; }

    .arrow { font-size: 13px; transition: transform 0.2s ease; }
    #go:hover:not(:disabled) .arrow { transform: translateX(3px); }

    .auto-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
    }

    .auto-row label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }

    .toggle { position: relative; width: 34px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 100px;
      transition: background 0.2s ease;
      cursor: pointer;
    }

    .toggle input:checked + .toggle-track { background: var(--fg); }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s ease;
      pointer-events: none;
    }

    .toggle input:checked ~ .toggle-thumb { transform: translateX(14px); }

    #log {
      margin-top: 28px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-all;
      max-width: 360px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #log.visible { opacity: 1; }
  </style>
</head>
<body>
  <div id="install">
    <p class="label">Senpai Stream</p>
    <h2>Installe<br><span>l'application.</span></h2>
    <div class="steps">
      <div class="step">
        <span class="step-num">01</span>
        <span class="step-text">Appuie sur <strong>Partager</strong> en bas de Safari</span>
      </div>
      <div class="step">
        <span class="step-num">02</span>
        <span class="step-text">Choisis <strong>Ajouter à l'écran d'accueil</strong></span>
      </div>
      <div class="step">
        <span class="step-num">03</span>
        <span class="step-text">Ouvre l'app depuis ton écran d'accueil</span>
      </div>
    </div>
    <div class="divider"></div>
    <button id="go">
      Continuer quand même
      <span class="arrow">→</span>
    </button>

    <div class="auto-row">
      <label class="toggle" for="autoOpen">
        <input type="checkbox" id="autoOpen">
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
      <label for="autoOpen">Ouvrir auto</label>
    </div>

    <div id="log"></div>
  </div>

<script>
  const PROXIES = [
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://thingproxy.freeboard.io/fetch/${url}`,
  ];

  const TARGET    = "https://senpai.wiki/";
  const LS_AUTO   = "senpai_auto_open";
  const logEl     = document.getElementById("log");

  // ── Logging ───────────────────────────────────────────────────────────────

  function log(msg) {
    console.log(msg);
    if (logEl) {
      logEl.classList.add("visible");
      logEl.textContent += msg + "\n";
    }
  }

  // ── Récupère le suffixe de chemin ─────────────────────────────────────────
  // GitHub Pages redirige les routes inconnues vers 404.html.
  // Notre 404.html encode le path dans window.location.hash (#/tv-show/...).
  // On lit d'abord le hash, sinon le pathname courant.

  function getSuffix() {
    // 1. Lire depuis le hash encodé par 404.html  →  "#/tv-show/gossip-girl"
    const hash = window.location.hash;
    if (hash && hash.startsWith('#/')) {
      const suffix = hash.slice(1); // retire le "#"
      // Nettoyer le hash de l'URL sans recharger la page
      history.replaceState(null, '', suffix || '/');
      return suffix === '/' ? '' : suffix;
    }

    // 2. Sinon, lire le pathname normal (mode standalone / PWA)
    const path = window.location.pathname;

    // Ignorer la redirection parasite de GitHub Pages
    if (path === '/Senpai-Stream-Redirect/' || path === '/Senpai-Stream-Redirect') {
      return '';
    }

    return path === '/' ? '' : path + window.location.search;
  }

  // ── Construit l'URL finale ────────────────────────────────────────────────

  function buildDestination(baseUrl, suffix) {
    try {
      const base = new URL(baseUrl);
      if (!suffix) return base.href;
      const dest = new URL(suffix, base.origin);
      return dest.href;
    } catch {
      const clean = baseUrl.replace(/\/$/, '');
      const sfx   = suffix.startsWith('/') ? suffix : '/' + suffix;
      return clean + sfx;
    }
  }

  // ── Scraping & redirection ────────────────────────────────────────────────

  async function tryProxy(proxyFn) {
    const proxyUrl = proxyFn(TARGET);
    log("→ " + proxyUrl);
    const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const html = await res.text();
    const doc  = new DOMParser().parseFromString(html, "text/html");
    const link = doc.querySelector("a.url-display");
    if (!link) throw new Error("a.url-display introuvable");
    log("✓ " + link.href);
    return link.href;
  }

  async function scrapeAndRedirect() {
    log("Recherche du lien...");
    const suffix = getSuffix();
    if (suffix) log("Suffixe : " + suffix);

    for (const proxyFn of PROXIES) {
      try {
        const baseUrl = await tryProxy(proxyFn);
        const dest    = buildDestination(baseUrl, suffix);
        if (dest !== baseUrl) log("→ destination : " + dest);
        window.location.replace(dest);
        return;
      } catch (e) {
        log("✗ " + e.message);
      }
    }
    log("Aucun proxy disponible.");
    alert("Impossible de récupérer le lien. Réessaie plus tard.");
  }

  // ── Toggle auto-open ──────────────────────────────────────────────────────

  const autoCheckbox = document.getElementById("autoOpen");
  autoCheckbox.checked = localStorage.getItem(LS_AUTO) === "1";
  autoCheckbox.addEventListener("change", () => {
    localStorage.setItem(LS_AUTO, autoCheckbox.checked ? "1" : "0");
  });

  // ── Boot ──────────────────────────────────────────────────────────────────

  (async () => {
    const isStandalone =
      window.navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone)").matches;

    if (isStandalone) {
      await scrapeAndRedirect();
    } else {
      document.getElementById("install").style.display = "flex";

      const btn = document.getElementById("go");

      async function triggerRedirect() {
        btn.disabled = true;
        btn.innerHTML = `Chargement <span class="arrow">...</span>`;
        await scrapeAndRedirect();
        btn.disabled = false;
        btn.innerHTML = `Continuer quand même <span class="arrow">→</span>`;
      }

      btn.onclick = triggerRedirect;

      if (localStorage.getItem(LS_AUTO) === "1") {
        await triggerRedirect();
      }
    }
  })();
</script>
</body>
</html>
