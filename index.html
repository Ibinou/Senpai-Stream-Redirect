<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Créé par Iban -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Senpai Stream">
  <title>Senpai Stream</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f3;
      --fg: #1a1a1a;
      --muted: #9a9a8e;
      --border: #e0dfd9;
      --accent: #1a1a1a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    #install {
      display: none;
      min-height: 100dvh;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 36px;
      gap: 0;
      animation: fadein 0.6s ease both;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h2 {
      font-size: clamp(28px, 7vw, 42px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--fg);
      margin-bottom: 32px;
    }

    h2 span { color: var(--muted); }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 48px;
    }

    .step { display: flex; gap: 14px; }

    .step-num {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      min-width: 18px;
      padding-top: 2px;
    }

    .step-text { font-size: 15px; line-height: 1.5; }

    .divider {
      width: 32px;
      height: 1px;
      background: var(--border);
      margin-bottom: 48px;
    }

    #go {
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 13px 28px;
      background: none;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      transition: 0.2s;
    }

    #go:hover:not(:disabled) {
      background: var(--fg);
      color: var(--bg);
    }

    #go:disabled { opacity: 0.4; cursor: not-allowed; }

    .arrow { transition: 0.2s; }
    #go:hover:not(:disabled) .arrow { transform: translateX(3px); }

    #log {
      margin-top: 28px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      white-space: pre-wrap;
      max-width: 360px;
      opacity: 0;
    }

    #log.visible { opacity: 1; }
  </style>
</head>

<body>
  <div id="install">
    <p class="label">Senpai Stream</p>
    <h2>Installe<br><span>l'application.</span></h2>

    <div class="steps">
      <div class="step"><span class="step-num">01</span><span class="step-text">Appuie sur <strong>Partager</strong></span></div>
      <div class="step"><span class="step-num">02</span><span class="step-text">Ajoute à l'écran d'accueil</span></div>
      <div class="step"><span class="step-num">03</span><span class="step-text">Ouvre l'app</span></div>
    </div>

    <div class="divider"></div>

    <button id="go">Continuer <span class="arrow">→</span></button>
    <div id="log"></div>
  </div>

<script>
  const PROXIES = [
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://thingproxy.freeboard.io/fetch/${url}`,
  ];

  const SHOWS = {
    "1": "tv-show/suits-avocats-sur-mesure",
    "2": "tv-show/gossip-girl",
  };

  const TARGET = "https://senpai.wiki/";
  const logEl = document.getElementById("log");

  function log(msg) {
    console.log(msg);
    logEl.classList.add("visible");
    logEl.textContent += msg + "\n";
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  async function getRealDomain() {
    for (const proxyFn of PROXIES) {
      try {
        const res = await fetch(proxyFn(TARGET), { signal: AbortSignal.timeout(8000) });
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, "text/html");
        const link = doc.querySelector("a.url-display");
        if (!link) throw new Error("no link");
        return new URL(link.href).hostname;
      } catch (e) {}
    }
    return null;
  }

  async function scrapeAndRedirectToShow(showPath) {
    const domain = await getRealDomain();
    if (!domain) return alert("Erreur proxy");

    const url = `https://${domain}/${showPath}`;
    window.location.replace(url);
  }

  async function scrapeAndRedirect() {
    for (const proxyFn of PROXIES) {
      try {
        const res = await fetch(proxyFn(TARGET), { signal: AbortSignal.timeout(8000) });
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, "text/html");
        const link = doc.querySelector("a.url-display");
        if (!link) throw new Error();
        window.location.replace(link.href);
        return;
      } catch (e) {}
    }
    alert("Impossible de récupérer le lien");
  }

  (async () => {
    const params = new URLSearchParams(location.search);
    const showParam = params.get("s");

    // ✅ DELAI AJOUTÉ ICI
    if (showParam && SHOWS[showParam]) {
      log("Attente 10 secondes...");
      await sleep(10000);
      await scrapeAndRedirectToShow(SHOWS[showParam]);
      return;
    }

    const isStandalone =
      navigator.standalone ||
      window.matchMedia("(display-mode: standalone)").matches;

    if (isStandalone) {
      await scrapeAndRedirect();
    } else {
      document.getElementById("install").style.display = "flex";

      document.getElementById("go").onclick = async () => {
        const btn = document.getElementById("go");
        btn.disabled = true;
        btn.innerHTML = `Chargement <span class="arrow">...</span>`;
        await scrapeAndRedirect();
      };
    }
  })();
</script>
</body>
</html>
